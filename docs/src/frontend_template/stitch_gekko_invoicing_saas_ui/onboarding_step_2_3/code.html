<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</label>
<!-- Classic Option -->
<label class="relative group cursor-pointer">
<input class="peer sr-only" name="format" type="radio" value="classic"/>
<div class="p-4 rounded-xl border border-outline-variant/15 bg-surface-container-low peer-checked:border-primary/50 peer-checked:bg-surface-container-highest transition-all duration-300">

</section>

<label class="font-headline font-bold text-sm text-on-surface-variant mb-2 block tracking-wide uppercase">Billing Currency</label>

<button class="mt-4 text-on-surface-variant hover:text-on-surface font-label text-sm transition-colors" type="button">

<footer class="w-full py-8 mt-auto border-t border-outline-variant/15 flex flex-col items-center gap-4">
<div class="flex flex-wrap justify-center items-center gap-8 px-8">

<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-label text-xs uppercase tracking-tighter">Secured connection</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant/60">
